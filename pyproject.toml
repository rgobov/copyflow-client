[project]
name = "copyflow-client"
version = "0.1.0"
description = "copyflow client app: receives signed signals, applies own risk limits, executes through own exchange keys"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]",
  "aiosqlite",
  "httpx",
  "aiogram>=3",
]

[project.optional-dependencies]
live = ["hyperliquid-python-sdk", "eth-account", "ccxt"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["copyflow_core*", "copyflow_client*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"copyflow_core/models.py" = ["UP042"]
"copyflow_client/models.py" = ["UP042"]
